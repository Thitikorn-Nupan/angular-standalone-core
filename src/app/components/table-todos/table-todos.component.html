<ng-container *ngIf="todos">
  <table class="table table-dark table-striped mt-5">
    <thead>
    <tr>
      <th scope="col" width="50%"  *ngFor="let colum of ['#','Title','Completed','Options'];">
        {{colum}}
        <ng-container *ngIf="colum === '#'">
          (1 - {{todos.length}})
        </ng-container>
      </th>
    </tr>
    </thead>
    <tbody>
    <ng-container *ngFor="let todo of todos; ">
      <tr *ngIf="todo.id <= 20" >
        <th>{{todo.id}}</th>
        <td>{{todo.title}} </td>
        <td>{{todo.completed}}</td>
        <td>
          <button (click)="onClickedRemoveOption(todo.id)" class="btn btn-danger">
            remove
          </button>
        </td>
      </tr>
    </ng-container>
    </tbody>
  </table>
</ng-container>
