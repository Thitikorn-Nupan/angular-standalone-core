<!-- *** No need validate this form because if user can access /options it's meaning user had logged in or isUserLoggedIn = true on localStorage -->
<strong class="mt-2">Checkbox For Open & Close Standalone Components</strong>
<div class="container mt-2">
  <form #formDisableComponents="ngForm" (change)="onFormChange(formDisableComponents.value)" class="form-check">
    <!-- if clicked then returns True -->
    <ng-container *ngFor="let checkboxObject of checkboxesObject">
      <input ngModel
             class="form-check-input"
             [name]="checkboxObject.name"
             type="checkbox">
      <label class="form-check-label">{{ checkboxObject.label }}</label>
      <br>
    </ng-container>
  </form>
</div>
<!-- Remember if you disable it means component will close too So when you able it it will work again as create new object that class -->
<ng-container *ngIf="disableFormModule">
  <app-understand-form-module></app-understand-form-module>
</ng-container>
<ng-container *ngIf="disableReactForm">
  <app-understand-reactive-form></app-understand-reactive-form>
</ng-container>
<ng-container *ngIf="disableStudentsTable">
  <app-table-students></app-table-students>
</ng-container>
<ng-container *ngIf="disableCreateStudentForm">
  <app-create-student-form></app-create-student-form>
</ng-container>
<ng-container *ngIf="disableTodosTable">
  <app-table-todos></app-table-todos>
</ng-container>
<ng-container *ngIf="disableTechTable">
  <app-table-tech></app-table-tech>
</ng-container>
<ng-container *ngIf="disableNgModelStandalone">
  <app-understnad-ngmodel-standalone></app-understnad-ngmodel-standalone>
</ng-container>
<ng-container *ngIf="disableInputDecoratorParent">
  <app-input-decorator-parent></app-input-decorator-parent>
</ng-container>
