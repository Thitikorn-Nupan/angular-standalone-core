<div class="mt-5">
  <form #searchForm="ngForm" (ngSubmit) ="onSubmitSearchForm(searchForm.value)" class="form form-control mt-1" >
    <div class="form-floating mb-3">
      <input ngModel type="text" name="category" class="form-control" id="floatingInput" >
      <label for="floatingInput">Category</label>
    </div>
    <button type="submit" class="btn btn-secondary mt-2">Submit</button>
  </form>

  <table class="table table-dark table-striped mt-5">
    <thead>
    <tr>
      <th scope="col" *ngFor="let column of ['#','Title','Description','Price','Image','Options']">{{column}}</th>
    </tr>
    </thead>
    <tbody>
    <ng-container *ngFor="let tech of techs">
      <tr >
        <th scope="row">{{tech.id}}</th>
        <td>{{tech.title}} </td>
        <td>{{tech.description}}</td>
        <td>{{tech.price | currency : 'THB'}}</td>
        <td><img width="90px" [src]="tech.image"></td>
        <td>
          <!-- just remove by id -->
          <button (click)="onRemoveOption(tech.id)" class="btn btn-danger">
            remove
          </button>
          <br>
          <button (click)="onEditOption(tech)" class="btn btn-warning mt-2">
            edit
          </button>
          <br>
          <button (click)="onAddOption(tech)" class="btn btn-secondary mt-2">
            add
          </button>
        </td>
      </tr>
    </ng-container>
    </tbody>
  </table>
</div>
